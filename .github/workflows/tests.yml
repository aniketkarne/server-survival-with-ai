name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Locale + scoring smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Locale wiring smoke test (every locale registered, key reference integrity)
        run: node test_locales.js
      - name: Locale key completeness (every i18n.t('key') reference resolves in every locale)
        run: node test_i18n_key_completeness.js
      - name: End-to-end i18n manager probe
        run: node test_i18n_e2e.js
      - name: Scoring + reputation invariants (no duplicate-add bug in updateScore)
        run: node test_scoring_reputation.js