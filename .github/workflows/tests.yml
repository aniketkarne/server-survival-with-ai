name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  i18n:
    name: Locale wiring smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Smoke test (every locale registered, key reference integrity)
        run: node test_locales.js
      - name: End-to-end i18n manager probe
        run: node test_i18n_e2e.js