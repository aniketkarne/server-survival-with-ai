name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  i18n-locale-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run i18n locale validation tests
        run: node test_i18n_locale_validation.js