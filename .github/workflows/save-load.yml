name: save-load

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  save-load:
    name: Save / load round trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Save / load round trip regression test
        run: node test_save_load.js
